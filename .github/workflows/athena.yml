name: Athena

# Answers messages from the Athena tab and runs Athena's jobs (daily brief, Monday plan,
# Friday wrap, Level 10). The app, or the database clock for scheduled jobs, saves a row to
# athena_requests and the athena-dispatch edge function sends a repository_dispatch here.
# Runs Claude Code on Stephanie's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN). Changes land
# in Supabase; the Vault sync workflow carries them to Obsidian.
on:
  repository_dispatch:
    types: [athena]
  workflow_dispatch:

# One run at a time. Every run answers everything queued, so a dispatch that waits loses nothing.
concurrency:
  group: athena
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Claude Code, the calendar reader and the image tools
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install --quiet icalendar==6.3.2 recurring-ical-events==3.8.2 pillow==11.3.0

      - name: Answer queued messages and run queued jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Lets Athena make post images in Blotato (athena/POSTS.md). Never used to post.
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
        run: python3 athena/answer.py
